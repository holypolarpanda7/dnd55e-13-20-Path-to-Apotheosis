# Test builds for every class but Wizard (wizard.toml has those). Generated 2026-10-04.
# Each class has a base build (its level 1 start save, made with bg3_new_character from "Tavizard L2 Base")
# and one build per subclass that has 13+ cases (or the class's core 2024 subclass when none has), levels 2-20,
# run hands-free with bg3_test_build.

[[build]]
id = "barbarian-base"
class = "Barbarian"
title = "Barbarian base, level 1 (start save for every Barbarian build)"
levels = [1, 1]
save_as = "Barbarian L1 Base"

[[build]]
id = "barbarian-berserkerpath"
class = "Barbarian"
title = "Barbarian - BerserkerPath, levels 2-20"
subclass = "BerserkerPath"
from = "barbarian-base"
levels = [2, 20]

