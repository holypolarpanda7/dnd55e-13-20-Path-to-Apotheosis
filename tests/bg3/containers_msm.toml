# Boon of Magic School Mastery: Rote/Signature free copies of spells with variant menus (2026-11-19, #82).
# One case per behaviour group of every copy's menu (bg3_lint_container_tests). Drafted by bg3_test_draft, then
# post-processed: statuses that only land under a condition the draft can't stage (AI helper, Item(), Heightened) are
# dropped, and each case also checks that the copy's loaded costs spend no spell slot.
# Run: bg3_test_run("apotheosis", "<id>").

[suite]
name = "Magic School Mastery containers"
mode = "script"

[[case]]
id = "msm-projectile-ballisticsmite-acid-epicrote"
title = "Magic School Mastery Rote Casting: Projectile_BallisticSmite_Acid (free copy, no slot)"
spell = "Projectile_BallisticSmite_Acid_EpicRote"
target = "A"
real_rolls = true
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", boost = "RollBonus(Attack,30)" }, { target = "A", boost = "CriticalHit(AttackTarget,Success,Never)" }]
expect = [{ target = "A", hp_change = [-24, -2] }, { resource = "SpellSlot", level = 1, change = 0 }]
covers = ["Projectile_BallisticSmite_Poison_EpicRote", "Projectile_BallisticSmite_Thunder_EpicRote"]
notes = "Stands for 2 alike option(s): Projectile_BallisticSmite_Poison_EpicRote, Projectile_BallisticSmite_Thunder_EpicRote."

