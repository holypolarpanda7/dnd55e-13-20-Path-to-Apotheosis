# Container coverage for the spells PTA added or extended in the 2026-10-13 high-level round (bg3_lint_container_tests): Sangromancy
# upcast variants, Balm 7-10, Warrior of the Gods, Searing Arc Strike 6-9, the Experimental Elixir options, Replicate Magic Item plans,
# the Ring of the Ram, the Beast Master companions, the Illusion summons. Drafted by bg3_test_draft from the stats and NOT run in game:
# every case carries its confidence and TODOs. The RMI cases need an Artificer of the level in their TODO (`build` / `class` / `level`),
# the Searing Arc and companion cases a Monk / Ranger; fix or drop whatever the first run shows (written 2026-10-13).
# Run: bg3_test_run("apotheosis", "<id>").

[suite]
name = "Container coverage, high-level round"
mode = "script"

# draft confidence: medium
# TODO: damage scales with a class level: on a host of another class it can be 0 - test on a real character
[[case]]
id = "cont-hl-projectile-apo-ringoftheram-1"
title = "Projectile_Apo_RingOfTheRam_1"
spell = "Projectile_Apo_RingOfTheRam_1"
target = "A"
real_rolls = true
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", boost = "ActionResource(ApoRamRing,7,0)" }, { target = "host", boost = "RollBonus(RangedSpellAttack,30)" }, { target = "A", boost = "CriticalHit(AttackTarget,Success,Never)" }]
expect = [{ target = "A", hp_change = [-40, -2] }, { resource = "ApoRamRing", level = 0, change = -1 }]

