# Regression checks for fixed features (#17, #21, #22 - 2026-09-30).
# Run: bg3_test_run("apotheosis", "<id>"); player-mode cases: bg3_test_stage + attack from the hotbar + bg3_test_verify.

[suite]
name = "Feature fixes"
mode = "script"

[[case]]
id = "fix21-lightning-strike"
title = "Controlled Wild Magic Lightning Strike damages a nearby hostile wolf (#21)"
spell = "Shout_WildMagicControlled_LightningStrike"
target = "host"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 3 }]
expect = [
  { cast = true },
  { target = "A", hp_change = [-48, -4], damage_type = "Lightning" },
]

[[case]]
id = "fix17-extra-attack-3"
title = "Fighter 20 Extra Attack (3): four attacks step EXTRA_ATTACK_3 -> _2 -> EXTRA_ATTACK (#17)"
spell = "Target_MainHandAttack"
target = "A"
repeat = 4
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 1.5 }]
setup = [{ target = "host", passive = "ExtraAttack" }, { target = "host", passive = "ExtraAttack_2" },
         { target = "host", passive = "ExtraAttack_3" },
         { target = "A", boost = "ActionResourceBlock(ReactionActionPoint)" }]   # no opportunity attack interrupting the script
notes = "Verified 2026-09-30: EXTRA_ATTACK_3_Q -> EXTRA_ATTACK_3 -> EXTRA_ATTACK_2 -> EXTRA_ATTACK_Q -> EXTRA_ATTACK -> none over 4 attacks."
expect = [
  { cast = true },
  { target = "host", status_applied = ["EXTRA_ATTACK_3", "EXTRA_ATTACK_2", "EXTRA_ATTACK"] },
  { target = "A", hp_change = [-80, -4] },
]

[[case]]
id = "fix17-extra-attack-3-player"
mode = "player"
title = "Fighter 20 Extra Attack (3): one action gives four weapon attacks (#17)"
spell = "Target_MainHandAttack"
target = "A"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 1.5 }]
setup = [{ target = "host", passive = "ExtraAttack" }, { target = "host", passive = "ExtraAttack_2" },
         { target = "host", passive = "ExtraAttack_3" }]
instructions = "Attack the wolf with Main Hand Attack four times. The 2nd-4th attacks should cost no action (the icon glows); a 5th should need an action."
expect = [
  { target = "host", status_applied = ["EXTRA_ATTACK_3", "EXTRA_ATTACK_2", "EXTRA_ATTACK"] },
  { resource = "ActionPoint", level = 0, change = -1 },
]

[[case]]
id = "wm-force-explosion"
title = "Controlled Wild Magic Force Explosion damages a nearby hostile wolf (#21: ImmediateCast skipped the area)"
spell = "Shout_WildMagicControlled_ForceExplosion"
target = "host"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 2 }]
expect = [
  { cast = true },
  { target = "A", hp_change = [-18, -3] },
]

[[case]]
id = "fix22-indomitable-might-checks"
title = "Indomitable Might: Strength checks and Athletics total at least the Strength score; other checks unaffected (#22)"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 8 }]   # combat start refreshes the floors
setup = [{ target = "host", passive = "Barbarian_IndomitableMight" }]
rolls = [{ as = "str", type = "RawAbility", id = "Strength", dc = 8, n = 30 },
         { as = "ath", type = "SkillCheck", id = "Athletics", dc = 8, n = 30 },
         { as = "dex", type = "RawAbility", id = "Dexterity", dc = 8, n = 30 },
         { as = "acro", type = "SkillCheck", id = "Acrobatics", dc = 8, n = 30 }]
notes = "Written for a Strength 8 host (floor 9, every total >= 8 vs DC 8). Strength SAVES: only spell/effect saves can be floored (HasSavingThrowWithAbility); a passive save carries no ability for a condition to read - known gap."
expect = [
  { roll = "str", pass = [30, 30] },
  { roll = "ath", pass = [30, 30] },
  { roll = "dex", pass = [0, 29] },
  { roll = "acro", pass = [0, 29] },
]

[[case]]
id = "fix18-spell-mastery-select"
title = "Spell Mastery: picking a level 1 and a level 2 spell unlocks both and closes the selection (#18)"
setup = [{ target = "host", passive = "SpellMastery" }]
casts = [{ spell = "Shout_SpellMastery" }, { spell = "Shout_SM_MagicMissile", wait = 3 }, { spell = "Shout_SM_Web", wait = 3 }]
expect = [
  { target = "host", status_present = ["SM_UNLOCK_MAGICMISSILE", "SM_UNLOCK_WEB", "SPELL_MASTERY_BLOCK", "SPELL_MASTERY_CHOSEN"], status_absent = ["SPELL_MASTERY_SELECTION"] },
]

[[case]]
id = "fix18-spell-mastery-swap"
title = "Spell Mastery: after a Long Rest one pick replaces the same-level spell and closes again (#18)"
setup = [{ target = "host", passive = "SpellMastery" }, { target = "host", status = "SM_UNLOCK_MAGICMISSILE", turns = -1 }, { target = "host", status = "SM_UNLOCK_WEB", turns = -1 }, { target = "host", status = "SPELL_MASTERY_CHOSEN", turns = -1 }]
casts = [{ spell = "Shout_SpellMastery" }, { spell = "Shout_SM_Sleep", wait = 3 }]
expect = [
  { target = "host", status_present = ["SM_UNLOCK_SLEEP", "SM_UNLOCK_WEB", "SPELL_MASTERY_BLOCK"], status_absent = ["SM_UNLOCK_MAGICMISSILE", "SPELL_MASTERY_SELECTION"] },
]

[[case]]
id = "fix18-spell-mastery-free-cast"
mode = "auto"
title = "Spell Mastery: the mastered Magic Missile hits a wolf and costs no spell slot (#18)"
spell = "Projectile_MagicMissile_SM"
target = "A"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", status = "SM_UNLOCK_MAGICMISSILE", turns = -1 }]
expect = [
  { cast = true },
  { target = "A", hp_change = [-15, -3] },
  { resource = "SpellSlot", level = 1, change = 0 },
]

[[case]]
id = "fix19-time-stop-freeze"
mode = "script"
title = "Time Stop: the caster gets TIME_STOP and every other creature in the combat is frozen (#19)"
spell = "Shout_TimeStop"
target = "host"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 8 }, { as = "B", template = "boar", faction = "hostile", hp = 300, distance = 10 }]
expect = [
  { cast = true },
  { target = "host", status_present = ["TIME_STOP"] },
  { target = "A", status_present = ["TIME_STOPPED"] },
  { target = "B", status_present = ["TIME_STOPPED"] },
]

[[case]]
id = "fix19-time-stop-break"
mode = "script"
title = "Time Stop: hitting a frozen creature ends the spell for everyone (#19)"
spell = "Projectile_MagicMissile"
target = "A"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 8 }, { as = "B", template = "boar", faction = "hostile", hp = 300, distance = 10 }]
casts = [{ spell = "Shout_TimeStop", target = "host", wait = 2 }]
expect = [
  { target = "A", hp_change = [-15, -3] },
  { target = "host", status_absent = ["TIME_STOP"] },
  { target = "A", status_absent = ["TIME_STOPPED"] },
  { target = "B", status_absent = ["TIME_STOPPED"] },
]

[[case]]
id = "fix19-time-stop-turns"
mode = "script"
title = "Time Stop: you take 1d4+1 turns in a row, then the frozen creatures act again (#19)"
spell = "Shout_TimeStop"
target = "host"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 8 }, { as = "B", template = "boar", faction = "hostile", hp = 300, distance = 10 }]
setup = [{ target = "host", max_hp = 300 }]
end_turns = 7
expect = [
  { consecutive_turns = "host", count = [2, 5] },
  { took_turn = "A" },
  { target = "A", status_absent = ["TIME_STOPPED"] },
  { target = "host", status_absent = ["TIME_STOP"] },
]

[[case]]
id = "fix20-true-polymorph-sheep"
mode = "script"
title = "True Polymorph: an enemy wolf becomes a sheep for the hour (#20)"
spell = "Target_TruePolymorph_Sheep"
target = "A"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 6 }]
expect = [
  { cast = true },
  { target = "A", status_present = ["TRUE_POLYMORPH_SHEEP", "TRUE_POLYMORPH_TEMPHP_SHEEP"] },
]

[[case]]
id = "fix20-true-polymorph-object"
mode = "script"
title = "True Polymorph: creature into object - an enemy wolf becomes a wheel of cheese (#20)"
spell = "Target_TruePolymorph_Cheese"
target = "A"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 6 }]
expect = [
  { cast = true },
  { target = "A", status_present = ["TRUE_POLYMORPH_CHEESE"] },
]

[[case]]
id = "fix20-true-polymorph-self"
mode = "script"
title = "True Polymorph: you (level 2) can become a Dire Wolf (CR 1) with 37 temporary HP, no save for a willing target (#20)"
spell = "Target_TruePolymorph_DireWolf"
target = "host"
expect = [
  { cast = true },
  { target = "host", status_present = ["TRUE_POLYMORPH_DIREWOLF", "TRUE_POLYMORPH_TEMPHP_DIREWOLF"] },
]

[[case]]
id = "fix22-im-spell-save-control"
title = "Control: without the floor the same Bash saves are real rolls and sometimes fail (#22)"
spell = "Target_Bash"
mode = "script"
caster = "A"
target = "host"
real_rolls = true
repeat = 8
repeat_wait = 3
clear_between = ["PRONE"]
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 2 }]
setup = [{ target = "host", max_hp = 300 }]
expect = [{ target = "host", status_applied_count = { status = "PRONE", count = [1, 8] } }]

[[case]]
id = "fix22-im-spell-save-dex-control"
title = "Control: the Strength floor doesn't touch a Dexterity save (badger Burrow, Dex DC 13) (#22)"
spell = "Target_Burrow_GiantBadger"
mode = "script"
caster = "A"
target = "host"
real_rolls = true
repeat = 8
repeat_wait = 3
clear_between = ["PRONE"]
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 2 }]
setup = [{ target = "host", max_hp = 300 }, { target = "host", status = "APO_IM_SAVE_20", turns = 100 }]
expect = [{ target = "host", status_applied_count = { status = "PRONE", count = [1, 8] } }]

[[case]]
id = "fix22-im-ai-spell-save-control"
title = "Control: the same Strength Drain fight without Indomitable Might - Strength 18 fails some saves vs DC 14 (#22)"
mode = "ai"
ai_samples = 4
spell = "Target_StrengthDrain_Shadow"
caster = "A"
target = "B"
ai_rounds = 12
clear_between = ["STRENGTH_DRAIN"]
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 8 }, { as = "B", template = "wolf", faction = "friendly", hp = 300, distance = 6 }]
setup = [{ target = "host", max_hp = 300 }, { target = "B", boost = "Ability(Strength,4)" }]
expect = [
  { cast_only = "A" },
  { cast_count = { by = "A", count = [1, 99] } },
  { target = "B", saves = { ability = "Strength", spell_only = true, n = [1, 99], failed = [1, 99] } },
]

[[case]]
id = "fix22-im-shadow-native"
title = "Indomitable Might on the player vs a real Shadow's NATIVE Strength Drain (AI cast): Strength 16 vs DC 14 - every failed roll rescued (#22)"
mode = "ai"
ai_samples = 12
spell = "Target_StrengthDrain_Shadow"
caster = "A"
target = "host"
sanctuary = false
ai_rounds = 30
clear_between = ["STRENGTH_DRAIN"]
spawn = [{ as = "A", template = "749b1e7d-63a1-4a3d-b0ca-f237b9ada5c4", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", max_hp = 300 }, { target = "host", boost = "Ability(Strength,8)" }, { target = "host", passive = "Barbarian_IndomitableMight" }]
notes = "Shadow_A knows Target_StrengthDrain_Shadow natively - reactions never fire on Osi.AddSpell spells. PASS 2026-10-02: 2/2 failed rolls rescued."
expect = [
  { cast_only = "A" },
  { target = "host", saves = { ability = "Strength", spell_only = true, n = [1, 99], effect_status = "STRENGTH_DRAIN", rescued = true } },
]

[[case]]
id = "fix22-im-shadow-native-control"
title = "Control: the same native Shadow fight WITHOUT Indomitable Might - failed rolls let Strength Drain land (#22)"
mode = "ai"
ai_samples = 8
spell = "Target_StrengthDrain_Shadow"
caster = "A"
target = "host"
sanctuary = false
ai_rounds = 30
clear_between = ["STRENGTH_DRAIN"]
spawn = [{ as = "A", template = "749b1e7d-63a1-4a3d-b0ca-f237b9ada5c4", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", max_hp = 300 }, { target = "host", boost = "Ability(Strength,8)" }]
expect = [
  { cast_only = "A" },
  { target = "host", saves = { ability = "Strength", spell_only = true, n = [1, 99], failed = [1, 99], effect_status = "STRENGTH_DRAIN" } },
]

[[case]]
id = "fix22-im-shadow-native-low-str"
title = "Indomitable Might is exact: Strength 12 (score below DC 14) - the score doesn't succeed, so failed rolls still land (#22)"
mode = "ai"
ai_samples = 6
spell = "Target_StrengthDrain_Shadow"
caster = "A"
target = "host"
sanctuary = false
ai_rounds = 30
clear_between = ["STRENGTH_DRAIN"]
spawn = [{ as = "A", template = "749b1e7d-63a1-4a3d-b0ca-f237b9ada5c4", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", max_hp = 300 }, { target = "host", boost = "Ability(Strength,4)" }, { target = "host", passive = "Barbarian_IndomitableMight" }]
expect = [
  { cast_only = "A" },
  { target = "host", saves = { ability = "Strength", spell_only = true, n = [1, 99], failed = [1, 99], effect_status = "STRENGTH_DRAIN" } },
]

[[case]]
id = "fix48-overchannel-max"
title = "Evoker Overchannel maximises a 3rd-level damage spell (Fireball 8d6 -> 48, half on a save) instead of adding Intelligence (#48)"
spell = "Projectile_Fireball"
target = "A"
real_rolls = true
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 500, distance = 16 }]
setup = [{ target = "host", passive = "Evoker_14_Overchannel" }]
notes = "Un-maximised Fireball averages 28 (14 on a save); maximised is 48, or 24 on a save, so the floor of this range is above anything a normal roll reaches on a failed save."
expect = [
  { cast = true },
  { target = "A", hp_change = [-48, -24] },
]

[[case]]
id = "fix59-overchannel-toggle-off"
title = "Overchannel toggled off: Fireball rolls normally (not 48 on a failed save) (#59)"
spell = "Projectile_Fireball"
target = "A"
real_rolls = true
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 500, distance = 16 }]
setup = [{ target = "host", passive = "Evoker_14_Overchannel" }, { target = "host", toggle_off = "Evoker_14_Overchannel" },
         { target = "A", boost = "AbilityFailedSavingThrow(Dexterity)" }]
notes = "The save is forced to fail, so a maximised Fireball is exactly 48; a normal 8d6 reaches 48 only on eight sixes (1 in 1.7 million)."
expect = [
  { cast = true },
  { target = "A", hp_change = [-47, -8] },
]
