# Spell container coverage (2026-10-05): one case per behaviour group of every container's children
# (bg3_lint_container_tests). Drafted by bg3-data-mcp drafting.spell_cases, reviewed; `covers` lists the alike
# children a case stands for. Written before any in-game run.
# Run: bg3_test_run("apotheosis", "<id>").

[suite]
name = "Spell containers"
mode = "script"

# draft confidence: high
[[case]]
id = "cont-projectile-chromaticorb-sm-projectile-chromaticorb-acid-sm"
title = "Projectile_ChromaticOrb_SM: Projectile_ChromaticOrb_Acid_SM (+5 alike)"
spell = "Projectile_ChromaticOrb_Acid_SM"
target = "A"
real_rolls = true
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", status = "SM_UNLOCK_CHROMATICORB", turns = -1 }, { target = "host", boost = "RollBonus(RangedSpellAttack,30)" }, { target = "A", boost = "CriticalHit(AttackTarget,Success,Never)" }]
expect = [{ target = "A", hp_change = [-48, -3] }]
covers = ["Projectile_ChromaticOrb_Cold_SM", "Projectile_ChromaticOrb_Fire_SM", "Projectile_ChromaticOrb_Lightning_SM", "Projectile_ChromaticOrb_Poison_SM", "Projectile_ChromaticOrb_Thunder_SM"]
notes = "Stands for 5 alike option(s) of Projectile_ChromaticOrb_SM."

