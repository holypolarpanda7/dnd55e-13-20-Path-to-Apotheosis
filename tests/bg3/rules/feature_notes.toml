# Hand-kept: rules features the check should not expect, with the reason (2026-10-05). Read with aliases.toml.
[feature]
# Arachnoid Stalker 17: dnd55e already has a Cunning Strike Paralytic Venom at 9 (docs/SUBCLASS_SOURCING.md)
"Paralytic Venom" = "skip"
# Rogue 14: Devious Strikes is the passive plus its three Cunning Strike toggles
"Devious Strikes" = ["Rogue_14_DeviousStrikes", "CunningStrike_Daze", "CunningStrike_KnockOut", "CunningStrike_Obscure"]

[technical]
# the Monk Features table's Unarmored Movement column at 14 and 18 (not a feature row of its own); passives scaling a column value
names = ["Apo_UnarmoredMovement_4", "Apo_UnarmoredMovement_5"]
