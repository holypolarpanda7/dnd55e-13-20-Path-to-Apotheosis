# Castability checks (#14): every one of these was missing a SpellAnimation, so a normal cast never resolved.
# Each case only expects the cast to happen (CastedSpell event) - effects are tested elsewhere.
# Run: bg3_test_run("apotheosis", "<id>").

[suite]
name = "Castable feature spells"
mode = "script"

[[case]]
id = "cast-Shout_CoronaOfLight"
title = "Shout_CoronaOfLight resolves when cast"
spell = "Shout_CoronaOfLight"
target = "host"
expect = [{ cast = true }]

