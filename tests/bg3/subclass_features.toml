         { target = "host", hp = 1 }, { target = "A", boost = "RollBonus(Attack,30)" }, { target = "host", boost = "RollBonus(SavingThrow,30)" }]
expect = [{ target = "host", status_applied = ["APO_UMBRAL_GRAVE_DOWNED"] }, { log = "/Strength of the Grave Charisma save vs DC \\d+ -> success/" },
          { target = "host", dead = false }]

