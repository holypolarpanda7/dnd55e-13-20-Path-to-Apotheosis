# Font of Magic conversions (Shout_CreateSorceryPoints_1..9): dnd55e's 1st-5th and our 6th-9th (PTA #44), for bg3_lint_container_tests.
# UseSpell never pays costs or checks RequirementConditions, so these prove the status/points path; the ceiling and the greyed-out
# levels were checked through the hotbar's CanUse on 2026-10-20 (PR #44). Run: bg3_test_run("apotheosis", "<id>").

[suite]
name = "Font of Magic: slot to Sorcery Points"
mode = "script"

[[case]]
id = "cont-fontofmagic-1"
title = "Shout_CreateSorceryPoints_1: a level 1 slot gives 1 Sorcery Points"
spell = "Shout_CreateSorceryPoints_1"
target = "host"
setup = [{ target = "host", boost = "ActionResource(SorceryPoint,20,0)" }, { target = "host", resource = "SorceryPoint", level = 0, amount = 0 }]
expect = [{ resource = "SorceryPoint", level = 0, amount_change = 1 }]

