# Spell visual effects (2026-10-12), built by the bg3-data MCP: bg3_fx_build("apotheosis", apply=True).
# Every effect here is derived from the base game's own effects only (never another mod's - see bg3_fx_provenance
# against=[...]): layered (parts), recoloured (palette) and/or enlarged (scale). Output: Public/<mod>/Assets/Effects/
# Effects_Banks/PTA_VFX/*.lsfx, Content/[PAK]_PTA_VFX/_merged.lsf, MultiEffectInfos/*.lsx and Scripts/data/vfx_generated.json
# (name -> UUID). Spells get them through Scripts/data/spell_vfx.toml + Scripts/apply_spell_vfx.py.
# Rules kept when layering: a part stays in the field kind it was made for (a CastEffect part in a CastEffect, a target
# effect in a TargetEffect); only parts with no bone (bones=-) are moved, e.g. ground AoE parts into a PositionEffect.
# Secondary layers take just their big area parts (`only`) so hand/eye glows don't double up. 8th/9th-level spells get
# the grand treatment (several layers, boss-scale parts, scale > 1); 7th-level spells mostly get a better-fitting look.

bank = "PTA_VFX"

[palettes.deathly]          # BG3's necrotic: pale teal
color = "#3fe0c0"
mode = "hue"

[palettes.nature]
color = "#5cbf3a"
mode = "hue"

[palettes.earth]            # dust and rock
color = "#8a6a3a"
mode = "tint"
brightness = 0.8
saturation = 0.7

[palettes.storm]
color = "#6fb0ff"
mode = "hue"

[palettes.water]
color = "#2f8fff"
mode = "hue"

[palettes.wish]             # arcane violet-gold for Wish's divine-intervention look on an arcane caster
color = "#b07cff"
mode = "hue"

