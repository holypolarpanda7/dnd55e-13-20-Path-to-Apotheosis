# Spell -> visual effect fields (2026-10-12). Values are effect names from Scripts/data/vfx.toml (UUIDs in
# vfx_generated.json); "" clears a field the spell would otherwise inherit (e.g. a radiant TargetEffect from Flame Strike
# on a spell that deals no radiant damage). Applied by Scripts/apply_spell_vfx.py, which runs last in regen_all.sh.
# Variants that `using` a parent (True Polymorph forms, Words of Creation, Befuddlement -> Feeblemind) inherit from it.

